    <script>
      // Apply the saved theme before paint to avoid a flash of the wrong theme. Light is the default.
      (function () {
        try {
          if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');

        } catch (e) {}
